<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File a Claim | Meridian Insurance</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1b2433; background: #f4f6fa; }
    header { background: #0b2a4a; color: #ffffff; padding: 16px 24px; font-weight: 700; letter-spacing: .02em; }
    main { max-width: 560px; margin: 32px auto; padding: 28px; background: #ffffff; border: 1px solid #d5dce8; border-radius: 12px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p.lead { color: #3b475c; margin: 0 0 12px; }
    label, input, select, textarea { display: block; width: 100%; box-sizing: border-box; }
    label { margin: 18px 0 6px; font-weight: 600; }
    input, select, textarea { border: 1px solid #5c6878; border-radius: 6px; padding: 10px; font: inherit; }
    button { margin-top: 20px; border: 0; border-radius: 6px; background: #0b4a8b; color: #ffffff; padding: 11px 18px; font: inherit; font-weight: 600; }
    .note { font-size: .9rem; color: #3b475c; }
    .result { margin-top: 20px; padding: 14px; background: #eef3fc; border-radius: 8px; }
  </style>
</head>
<body>
<!-- Seeded: missing language, three unlinked labels, one hidden button name; the textarea is already labelled correctly. Insurance claim form. -->
<header>Meridian Insurance</header>
<main>
  <h1>File a motor insurance claim</h1>
  <p class="lead">Have your policy number and the date of the incident ready.</p>
  <form action="#" method="get">
    <label for="claim-policy">Policy number</label>
    <input id="claim-policy" name="policy" type="text">
    <label for="claim-date">Date of incident</label>
    <input id="claim-date" name="incident_date" type="date">
    <label for="claim-amount">Estimated claim amount (₹)</label>
    <input id="claim-amount" name="amount" type="number" min="0">
    <label for="claim-desc">What happened?</label>
    <textarea id="claim-desc" name="description" rows="4"></textarea>
    <button id="submit-claim" type="submit"><span>Submit claim</span></button>
  </form>
</main>
</body>
</html>
