<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Card Sign-up | Campus Library</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1b2433; background: #ffffff; }
    main { max-width: 520px; margin: 40px auto; padding: 24px; }
    label, input { display: block; width: 100%; box-sizing: border-box; }
    label { margin: 18px 0 6px; font-weight: 600; }
    input { border: 1px solid #5c6878; border-radius: 6px; padding: 10px; font: inherit; }
    button { margin-top: 18px; border: 0; border-radius: 6px; background: #0b4a8b; color: #ffffff; padding: 10px 16px; font: inherit; }
  </style>
</head>
<body>
<main>
  <h1>Get your library card</h1>
  <p>Seeded: missing page language, three unlinked labels, one hidden button name.</p>
  <form action="#" method="get">
    <label>Full name</label>
    <input id="full-name" name="full_name" type="text">
    <label>Student ID number</label>
    <input id="student-id" name="student_id" type="text">
    <label>Phone number</label>
    <input id="phone" name="phone" type="tel">
    <button id="request-card" type="submit"><span aria-hidden="true">Request library card</span></button>
  </form>
</main>
</body>
</html>
