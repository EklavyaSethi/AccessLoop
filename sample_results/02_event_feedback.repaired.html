<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Fest Feedback</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1b2433; background: #ffffff; }
    main { max-width: 560px; margin: 40px auto; padding: 24px; }
    label, input, select { display: block; width: 100%; box-sizing: border-box; }
    label { margin: 18px 0 6px; font-weight: 600; }
    input, select { border: 1px solid #5c6878; border-radius: 6px; padding: 10px; font: inherit; }
    button { margin-top: 18px; border: 0; border-radius: 6px; background: #0b4a8b; color: #ffffff; padding: 10px 16px; font: inherit; }
  </style>
</head>
<body>
<main>
  <h1>Tech Fest feedback</h1>
  <img src="banner.png" width="480" height="120">
  <p>Seeded: one fixable label, plus image-alt, link-name and select-name issues that must go to manual review.</p>
  <form action="#" method="get">
    <label for="fb-email">Your email</label>
    <input id="fb-email" name="email" type="email">
    <select id="rating" name="rating">
      <option value="5">Excellent</option>
      <option value="3">Average</option>
      <option value="1">Poor</option>
    </select>
    <button id="send-feedback" type="submit">Send feedback</button>
  </form>
  <p><a href="#schedule"><svg aria-hidden="true" width="16" height="16"><rect width="16" height="16"/></svg></a></p>
</main>
</body>
</html>
