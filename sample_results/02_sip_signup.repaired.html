<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start a SIP | Meridian Wealth</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1b2433; background: #f4f6fa; }
    header { background: #0b2a4a; color: #ffffff; padding: 16px 24px; font-weight: 700; letter-spacing: .02em; }
    main { max-width: 560px; margin: 32px auto; padding: 28px; background: #ffffff; border: 1px solid #d5dce8; border-radius: 12px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p.lead { color: #3b475c; margin: 0 0 12px; }
    label, input, select, textarea { display: block; width: 100%; box-sizing: border-box; }
    label { margin: 18px 0 6px; font-weight: 600; }
    input, select, textarea { border: 1px solid #5c6878; border-radius: 6px; padding: 10px; font: inherit; }
    button { margin-top: 20px; border: 0; border-radius: 6px; background: #0b4a8b; color: #ffffff; padding: 11px 18px; font: inherit; font-weight: 600; }
    .note { font-size: .9rem; color: #3b475c; }
    .result { margin-top: 20px; padding: 14px; background: #eef3fc; border-radius: 8px; }
  </style>
</head>
<body>
<!-- Seeded: missing language, two fixable labels, plus image-alt, select-name and link-name that must go to manual review. Mutual fund SIP sign-up. -->
<header>Meridian Wealth</header>
<main>
  <h1>Start a monthly SIP</h1>
  <img src="banner-sip.png" width="480" height="100" alt="Reviewer typed description">
  <p class="lead">Invest a fixed amount every month. You can pause or stop at any time.</p>
  <form action="#" method="get">
    <label for="sip-name">Investor name</label>
    <input id="sip-name" name="investor" type="text">
    <label for="sip-amount">Monthly amount (₹)</label>
    <input id="sip-amount" name="amount" type="number" min="500">
    <select id="sip-fund" name="fund" aria-label="Reviewer typed description">
      <option value="index">Nifty 50 Index Fund</option>
      <option value="debt">Short Duration Debt Fund</option>
      <option value="hybrid">Balanced Hybrid Fund</option>
    </select>
    <button id="start-sip" type="submit">Start SIP</button>
  </form>
  <p class="note"><a href="#risk" aria-label="Reviewer typed description"><svg aria-hidden="true" width="16" height="16"><rect width="16" height="16"/></svg></a></p>
</main>
</body>
</html>
