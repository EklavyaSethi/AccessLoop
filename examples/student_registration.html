<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Campus Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #17243c; background: #f6f8fc; }
    main { max-width: 560px; padding: 42px; margin: 70px auto; background: white; border-radius: 18px; }
    h1 { font-size: 2rem; margin: 0 0 12px; }
    p { color: #35435a; }
    label, input { display: block; width: 100%; box-sizing: border-box; }
    label { margin: 26px 0 8px; font-weight: 600; }
    input { border: 1px solid #707e92; border-radius: 8px; padding: 12px; font: inherit; }
    button { margin-top: 20px; border: 0; border-radius: 8px; background: #1544a8; color: white; padding: 12px 18px; font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #edb100; outline-offset: 3px; }
  </style>
</head>
<body>
<main>
  <h1>Campus student registration</h1>
  <p>Complete this form to register for the upcoming orientation.</p>
  <form action="#" method="get">
    <label>University email</label>
    <input id="email" name="email" type="email" required>
    <button id="submit-registration" type="submit"><span aria-hidden="true">Submit registration</span></button>
  </form>
</main>
</body>
</html>
