<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Loan EMI Calculator | Meridian Bank</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1b2433; background: #f4f6fa; }
    header { background: #0b2a4a; color: #ffffff; padding: 16px 24px; font-weight: 700; letter-spacing: .02em; }
    main { max-width: 560px; margin: 32px auto; padding: 28px; background: #ffffff; border: 1px solid #d5dce8; border-radius: 12px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p.lead { color: #3b475c; margin: 0 0 12px; }
    label, input, select, textarea { display: block; width: 100%; box-sizing: border-box; }
    label { margin: 18px 0 6px; font-weight: 600; }
    input, select, textarea { border: 1px solid #5c6878; border-radius: 6px; padding: 10px; font: inherit; }
    button { margin-top: 20px; border: 0; border-radius: 6px; background: #0b4a8b; color: #ffffff; padding: 11px 18px; font: inherit; font-weight: 600; }
    .note { font-size: .9rem; color: #3b475c; }
    .result { margin-top: 20px; padding: 14px; background: #eef3fc; border-radius: 8px; }
  </style>
</head>
<body>
<!-- Seeded: three fixable labels; an icon-only reset button the agent must escalate (it cannot know the meaning). Loan EMI calculator. -->
<header>Meridian Bank</header>
<main>
  <h1>Home loan EMI calculator</h1>
  <p class="lead">Estimate your monthly instalment before you apply.</p>
  <form action="#" method="get">
    <label>Loan amount (₹)</label>
    <input id="emi-amount" name="principal" type="number" min="100000">
    <label>Interest rate (% per year)</label>
    <input id="emi-rate" name="rate" type="number" step="0.05">
    <label>Tenure (months)</label>
    <input id="emi-tenure" name="tenure" type="number" min="12" max="360">
    <button type="submit">Calculate EMI</button>
    <button id="emi-reset" type="reset"><svg aria-hidden="true" width="16" height="16"><circle cx="8" cy="8" r="6"/></svg></button>
  </form>
  <div class="result">Your estimated EMI appears here after you calculate.</div>
</main>
</body>
</html>
