<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment form edge cases the agent must NOT auto-fix</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1b2433; background: #f4f6fa; }
    header { background: #0b2a4a; color: #ffffff; padding: 16px 24px; font-weight: 700; letter-spacing: .02em; }
    main { max-width: 560px; margin: 32px auto; padding: 28px; background: #ffffff; border: 1px solid #d5dce8; border-radius: 12px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p.lead { color: #3b475c; margin: 0 0 12px; }
    label, input, select, textarea { display: block; width: 100%; box-sizing: border-box; }
    label { margin: 18px 0 6px; font-weight: 600; }
    input, select, textarea { border: 1px solid #5c6878; border-radius: 6px; padding: 10px; font: inherit; }
    button { margin-top: 20px; border: 0; border-radius: 6px; background: #0b4a8b; color: #ffffff; padding: 11px 18px; font: inherit; font-weight: 600; }
    .note { font-size: .9rem; color: #3b475c; }
    .result { margin-top: 20px; padding: 14px; background: #eef3fc; border-radius: 8px; }
  </style>
</head>
<body>
<!-- Six near-miss patterns on a payment form. A wrong automatic change here would be risky, so the agent must propose nothing. -->
<header>Meridian Bank</header>
<main>
  <h1>Fund transfer: ambiguous patterns</h1>
  <form action="#" method="get">
    <!-- A: label separated from input by a wrapper: not immediately adjacent -->
    <label>Beneficiary account number</label>
    <div><input id="acct" name="account" type="text"></div>

    <!-- B: input with no id: nothing safe to point a for= at -->
    <label>IFSC code</label>
    <input name="ifsc" type="text">

    <!-- C: duplicated id: a for= would be ambiguous -->
    <label>Amount (₹)</label>
    <input id="dup" name="amount" type="number">
    <input id="dup" name="confirm_amount" type="number">

    <!-- D: icon-only button: the agent cannot know the meaning -->
    <button id="mystery" type="button"><svg aria-hidden="true" width="16" height="16"><circle cx="8" cy="8" r="6"/></svg></button>

    <!-- E: hidden text but the button has no id to target -->
    <button type="button"><span aria-hidden="true">Pay now</span></button>

    <!-- F: two hidden spans: both are un-hidden together -->
    <button id="two-spans" type="button"><span aria-hidden="true">Confirm</span><span aria-hidden="true">transfer</span></button>
  </form>
  <!-- G: link whose only text is hidden: the reviewer types the name, and it must match what is visible -->
  <p><a href="/statements" id="stmt-link"><span aria-hidden="true">Statements</span></a></p>
</main>
</body>
</html>
